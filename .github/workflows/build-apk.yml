name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  schedule:
    - cron: '0 3 * * 1'          # فحص أسبوعي (الاثنين 03:00 UTC) للتأكد أن البناء سليم
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'تشغيل Lint والاختبارات'
        type: boolean
        default: true
      publish_release:
        description: 'نشر إصدار (Release) على GitHub'
        type: boolean
        default: false

# صلاحيات الحد الأدنى افتراضيًا، وكل مهمة تطلب ما تحتاجه فقط
permissions:
  contents: read

# إلغاء التشغيلات القديمة للـ Pull Request فقط (لا نلغي بناء إصدار قيد النشر)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # ------------------------------------------------------------------ فحص الجودة
  verify:
    name: Lint + Unit tests
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android-build
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Lint + Unit tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: رفع تقارير الفحص
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # --------------------------------------------------------------------- البناء
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write         # مطلوب لشهادة مصدر الملف (Attestation)
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android-build
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: تحديد رقم الإصدار
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: هل مفاتيح التوقيع متوفرة؟
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=التوقيع::لا يوجد KEYSTORE_BASE64 - سيتم بناء نسخة Debug فقط."
          fi

      - name: بناء APK (Debug)
        run: gradle :app:assembleDebug --stacktrace

      - name: بناء APK (Release موقّع)
        if: steps.keys.outputs.signed == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: تجهيز الملفات النهائية + بصمة SHA-256
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.name }}"
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "::error::لم يتم العثور على ملف APK الناتج."
            find app/build/outputs -maxdepth 3 || true
            exit 1
          fi
          cp "$DEBUG_APK" "dist/AST-2012A-ClinicalMaster-v${V}-debug.apk"
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "dist/AST-2012A-ClinicalMaster-v${V}-release.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: ملخص البناء
        run: |
          {
            echo "## ✅ تم بناء التطبيق - v${{ steps.ver.outputs.name }}"
            echo ""
            echo "| الملف | الحجم | SHA-256 |"
            echo "|---|---|---|"
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع ملفات APK كـ Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: شهادة مصدر الملف (Build Provenance)
        if: github.event_name != 'pull_request'
        continue-on-error: true   # قد لا تكون متاحة في المستودعات الخاصة بالخطة المجانية
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk

      - name: رفع تقارير البناء عند الفشل
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------- نشر الإصدار
  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: تنزيل ملفات APK
        uses: actions/download-artifact@v7
        with:
          name: apk-${{ github.run_number }}
          path: dist

      - name: إنشاء إصدار (Release) على GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: AST-2012A Clinical Master v${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            تطبيق أندرويد أصلي مكتوب بلغة Java (Gradle / Android SDK قياسي).

            نزّل ملف الـ APK من الأسفل وثبّته على جهاز أندرويد (فعّل "السماح بمصادر غير معروفة" أول مرة).

            - ملف `*-release.apk`: نسخة موقّعة بمفتاح الإصدار (تظهر فقط إذا أضفت أسرار التوقيع).
            - ملف `*-debug.apk`: نسخة تجريبية موقّعة بمفتاح Debug تلقائي، تكفي للتثبيت المباشر.
            - `SHA256SUMS.txt`: بصمات الملفات للتحقق من سلامتها.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
