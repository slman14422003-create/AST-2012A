name: Build Tashkeel Dictionary

# يبني قاموس التشكيل (app/src/main/assets/tashkeel_dict.txt) من مدوّنة Tashkeela
# على سيرفر GitHub، بدون الحاجة لكمبيوتر. شغّله يدويًا: Actions -> Build Tashkeel Dictionary -> Run workflow

on:
  workflow_dispatch:
    inputs:
      max_words:
        description: "أقصى عدد كلمات في القاموس"
        required: false
        default: "60000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: تنزيل مدوّنة Tashkeela من Hugging Face (حوالي 420 ميغا)
        run: |
          mkdir -p parquet
          BASE="https://huggingface.co/datasets/community-datasets/tashkeela/resolve/main/plain_text"
          for i in 00000 00001 00002; do
            curl -fL --retry 5 --retry-delay 10 -o "parquet/train-${i}-of-00003.parquet" \
              "${BASE}/train-${i}-of-00003.parquet"
          done
          ls -la parquet

      - name: تحويل parquet إلى نصوص
        run: |
          pip install pyarrow
          python3 tools/parquet_to_txt.py parquet corpus
          ls corpus | wc -l

      - name: بناء القاموس
        run: |
          python3 tools/build_tashkeel_dict.py corpus \
            -o app/src/main/assets/tashkeel_dict.txt \
            --max-words "${{ github.event.inputs.max_words || '60000' }}"
          wc -l app/src/main/assets/tashkeel_dict.txt
          head -n 15 app/src/main/assets/tashkeel_dict.txt

      - name: حفظ القاموس في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/tashkeel_dict.txt
          git commit -m "Add Tashkeel dictionary (built from Tashkeela corpus)" || echo "لا تغييرات"
          git push
