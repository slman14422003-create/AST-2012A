org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# مهلة أطول للاتصال بمستودعات Maven (mavenCentral/google) عند بطء الشبكة على
# عامل تشغيل CI، لتفادي فشل تنزيل مكتبات Gradle الداخلية (مثل kotlin-stdlib
# اللازمة لتفسير ملفات .gradle.kts) بسبب انقطاع مؤقت في الاتصال.
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=180000
